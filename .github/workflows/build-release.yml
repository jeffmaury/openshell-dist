name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to checkout and release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x64
            zip_name: openshell-x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
            zip_name: openshell-aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nvidia/OpenShell
          ref: ${{ inputs.version }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          experimental: true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-msvc-${{ matrix.arch }}
          cache-targets: "true"
          cache-on-failure: "true"
          cache-bin: "false"

      - run: mise run --skip-tools windows:build:${{ matrix.arch }}

      - name: Create zip archive
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/openshell.exe, target/${{ matrix.target }}/release/openshell-gateway.exe -DestinationPath ${{ matrix.zip_name }}.zip
        shell: pwsh

      - uses: actions/upload-artifact@ea165f8d65b6db9b8a1f7571828bae0b188b4df8 # v4.6.2
        with:
          name: ${{ matrix.zip_name }}
          path: ${{ matrix.zip_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ inputs.version }}
          tag_name: ${{ inputs.version }}
          files: artifacts/**/*.zip
